services:
  postgres-mart:
    image: postgres
    container_name: postgres-mart
    restart: always
    environment:
      POSTGRES_DB: mart_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata-mart:/var/lib/postgresql/data
    ports:
      - "5449:5432"

volumes:
  pgdata-mart: